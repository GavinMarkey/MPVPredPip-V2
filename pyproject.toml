[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpvpredpip"
version = "1.0.0"
description = "Linear peptide-based vaccine candidate prediction pipeline"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The core library is deliberately dependency-free so it can be imported from
# the pinned legacy environments the predictors require. These extras are only
# needed for the orchestrator and the test suite.
workflow = ["snakemake>=7.32", "pandas>=2.0", "biopython>=1.81", "openpyxl>=3.1"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
# Named explicitly rather than left to discovery. Without this, find() installs
# every package under src/, which is how a stale pre-rename copy of this library
# came to be installed alongside it: `pip install -e .` picked up both, and
# `import vaxpipe` kept resolving to code frozen before the rename. An editable
# install makes that worse, because the stale tree stays importable from the
# source directory rather than being overwritten.
include = ["mpvpredpip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "workflow/scripts"]

# Third-party code that this project does not maintain: tools/ holds the
# licence-gated predictors, which are downloaded rather than committed.
extend-exclude = [
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are usually documentation tables
    "F821",  # the `snakemake` global is injected into workflow scripts
]

[tool.ruff.lint.per-file-ignores]
"workflow/scripts/*" = ["E402"]  # sys.path bootstrap must precede imports
