# Stage 7 conservation analysis.
#
# MAFFT builds the alignment. The remaining packages are what a local ConSurf
# installation expects (cd-hit for redundancy reduction, Rate4Site for the
# conservation scores, a tree builder); they are installed here so that enabling
# conservation.consurf in config.yaml does not require rebuilding the image.
name: mpvpredpip-conservation
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - mafft>=7.5
  - cd-hit>=4.8
  - clustalo>=1.2
  - muscle>=5.1
  - rate4site
  - raxml
  - biopython>=1.81
  - numpy
